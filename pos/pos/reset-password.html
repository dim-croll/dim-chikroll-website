
<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | DIM CHIKROLL</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .box {
      background: white;
      color: #101827;
      padding: 30px;
      border-radius: 14px;
      width: 85%;
      max-width: 360px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 7px;
      font-size: 16px;
    }
    input { border: 1px solid #ccc; }
    button {
      background: #F3A538;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    #message { margin-top: 15px; }
  </style>
</head>

<body>
  <div class="box">
    <h2>DIM CHIKROLL</h2>
    <h3>Tetapkan Password Baharu</h3>

    <form id="resetForm">
      <input
        type="password"
        id="password"
        placeholder="Password baharu"
        minlength="8"
        required
      >

      <input
        type="password"
        id="confirmPassword"
        placeholder="Ulang password baharu"
        minlength="8"
        required
      >

      <button type="submit">SIMPAN PASSWORD</button>
    </form>

    <p id="message"></p>
  </div>

  <script>
    const SUPABASE_URL =
      "https://mpyobhdrphkmlbhxfvam.supabase.co";

    const SUPABASE_KEY = "sb_publishable_-YVWCgR2j4vBO5-nuOLElA_5NT5is4V";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirmPassword").value;

      if (password !== confirm) {
        message.textContent = "Password tidak sama.";
        return;
      }

      message.textContent = "Sedang menyimpan...";

      const { error } = await client.auth.updateUser({
        password: password
      });

      if (error) {
        message.textContent = "Ralat: " + error.message;
        return;
      }

      message.textContent =
        "Password berjaya ditukar. Sila kembali ke POS untuk login.";

      form.reset();
    });
  </script>
</body>
</html>
