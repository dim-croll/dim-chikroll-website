
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>DIM CHIKROLL POS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif}
header{background:#17243a;padding:17px 22px;display:flex;justify-content:space-between;align-items:center}
.logo{color:#f3a538;font-size:21px;font-weight:900}
.sub{font-size:11px;color:#aab4c3}
.status{font-size:12px;color:#36d399}
main{max-width:1000px;margin:auto;padding:20px}
h2{font-size:20px}
.panel{background:#1c293a;border:1px solid #344156;border-radius:13px;padding:17px;margin-bottom:18px}
label{display:block;font-size:13px;color:#cbd2dc;margin:12px 0 6px}
select{width:100%;padding:13px;background:#101827;color:white;border:1px solid #46546a;border-radius:8px;font-size:15px}
button{border:0;border-radius:8px;padding:13px;background:#f3a538;color:#101827;font-weight:bold;font-size:14px;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.product{background:#1c293a;border:1px solid #344156;border-radius:12px;padding:17px;text-align:center}
.product .emoji{font-size:35px}
.product h3{font-size:15px}
.price{color:#f3a538;font-weight:bold}
.product button{width:100%;margin-top:12px}
.cart-item{border-bottom:1px solid #46546a;padding:12px 0}
.cart-item p{font-size:12px;color:#b9c3d0;margin:5px 0}
.cart-actions{display:flex;align-items:center;gap:10px;margin-top:9px}
.cart-actions button{padding:7px 12px}
.remove{background:#923c43;color:white}
.total{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #46546a;padding-top:15px;margin-top:15px}
.total strong{font-size:27px;color:#f3a538}
.empty{color:#aab4c3;font-size:14px}
.notice{font-size:12px;color:#aab4c3;margin-top:12px}
@media(min-width:700px){.layout{display:grid;grid-template-columns:1fr 360px;gap:20px}.cart-panel{align-self:start;position:sticky;top:15px}}
</style>
</head>
<body>
<header>
  <div>
    <div class="logo">DIM CHIKROLL.</div>
    <div class="sub">POINT OF SALE</div>
  </div>
  <div class="status" id="status">● ONLINE</div>
</header>

<main>
  <div class="layout">
    <section>
      <h2>Pilih Produk</h2>
      <div class="products">
        <div class="product">
          <div class="emoji">🌯</div>
          <h3>CHIKROLL</h3>
          <div class="price">RM12.00</div>
          <button onclick="openOptions()">PILIH</button>
        </div>
      </div>

      <div class="panel" id="options" hidden>
        <h2>Pilihan Chikroll</h2>
        <label for="sauce">Filling / Sauce</label>
        <select id="sauce">
          <option value="Garchee">Garchee</option>
          <option value="Smoke BBQ">Smoke BBQ</option>
          <option value="Korean Spicy">Korean Spicy</option>
        </select>

        <label for="seasoning">Seasoning</label>
        <select id="seasoning">
          <option value="Garlic Herb">Garlic Herb</option>
          <option value="BBQ">BBQ</option>
          <option value="Spicy Korean">Spicy Korean</option>
        </select>

        <label for="quantity">Kuantiti</label>
        <select id="quantity">
          <option>1</option><option>2</option><option>3</option>
          <option>4</option><option>5</option><option>10</option>
        </select>

        <button style="width:100%;margin-top:18px" onclick="addToCart()">
          TAMBAH KE CART
        </button>
        <button style="width:100%;margin-top:8px;background:#46546a;color:white"
          onclick="closeOptions()">BATAL</button>
      </div>
    </section>

    <section class="panel cart-panel">
      <h2>Pesanan Semasa</h2>
      <div id="cart"><p class="empty">Belum ada pesanan.</p></div>
      <div class="total">
        <span>JUMLAH</span>
        <strong id="total">RM0.00</strong>
      </div>
      <button id="checkout" style="width:100%;margin-top:16px" disabled>
        CHECKOUT
      </button>
      <p class="notice">Harga asas RM12.00 setiap Chikroll.</p>
    </section>
  </div>
</main>

<footer style="text-align:center;color:#8995a6;font-size:12px;padding:20px">
  DIM CHIKROLL POS · Version 1.0
</footer>

<script>
const SUPABASE_URL = "https://mpyobhdrphkmlbhxfvam.supabase.co";
const SUPABASE_KEY = "sb_publishable_-YVWCgR2j4vBO5-nuOLElA_5NT5is4V";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
console.log("Supabase connected:", !!supabaseClient);
const PRICE = 12;
let cart = [];

async function openOptions(){
  document.getElementById("options").hidden = false;

  const sauceSelect = document.getElementById("sauce");
  const seasoningSelect = document.getElementById("seasoning");

  sauceSelect.innerHTML = '<option value="">Loading...</option>';
  seasoningSelect.innerHTML = '<option value="">Loading...</option>';

  const { data, error } = await supabaseClient
    .from("product_options")
    .select("name, option_type")
    .eq("is_active", true)
    .order("name");

  if(error){
    alert("Gagal memuatkan pilihan: " + error.message);
    return;
  }

  sauceSelect.innerHTML = "";
  seasoningSelect.innerHTML = "";

  data.forEach(option => {
    const element = document.createElement("option");
    element.value = option.name;
    element.textContent = option.name;

    if(option.option_type.toLowerCase() === "sauce"){
      sauceSelect.appendChild(element);
    }

    if(option.option_type.toLowerCase() === "seasoning"){
      seasoningSelect.appendChild(element);
    }
  });
}

function closeOptions(){
  document.getElementById("options").hidden = true;
}

function addToCart(){
  const sauce = document.getElementById("sauce").value;
  const seasoning = document.getElementById("seasoning").value;
  const qty = Number(document.getElementById("quantity").value);

  const existing = cart.find(x =>
    x.sauce === sauce && x.seasoning === seasoning
  );

  if(existing){
    existing.qty += qty;
  }else{
    cart.push({
      sauce, seasoning, qty,
      id: crypto.randomUUID()
    });
  }

  renderCart();
  closeOptions();
}
function changeQty(id, amount){
  const item = cart.find(x => x.id === id);
  if(!item) return;
  item.qty += amount;
  if(item.qty <= 0){
    cart = cart.filter(x => x.id !== id);
  }
  renderCart();
}
function removeItem(id){
  cart = cart.filter(x => x.id !== id);
  renderCart();
}
function renderCart(){
  const container = document.getElementById("cart");
  const total = cart.reduce((sum,x) => sum + x.qty * PRICE,0);

  if(cart.length === 0){
    container.innerHTML = '<p class="empty">Belum ada pesanan.</p>';
  }else{
    container.innerHTML = cart.map(x => `
      <div class="cart-item">
        <strong>Chikroll × ${x.qty}</strong>
        <p>Filling: ${x.sauce}</p>
        <p>Seasoning: ${x.seasoning}</p>
        <strong>RM${(x.qty*PRICE).toFixed(2)}</strong>
        <div class="cart-actions">
          <button onclick="changeQty('${x.id}',-1)">−</button>
          <span>${x.qty}</span>
          <button onclick="changeQty('${x.id}',1)">+</button>
          <button class="remove" onclick="removeItem('${x.id}')">BUANG</button>
        </div>
      </div>
    `).join("");
  }

  document.getElementById("total").textContent =
    "RM" + total.toFixed(2);
  document.getElementById("checkout").disabled = cart.length === 0;
}
function updateStatus(){
  const el = document.getElementById("status");
  el.textContent = navigator.onLine ? "● ONLINE" : "● OFFLINE";
  el.style.color = navigator.onLine ? "#36d399" : "#ff7373";
}
window.addEventListener("online",updateStatus);
window.addEventListener("offline",updateStatus);
updateStatus();
</script>
  
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .then(() => console.log("DIM CHIKROLL POS: Offline ready"))
      .catch(error => console.error("Service Worker error:", error));
  });
}
</script>

</body>
</html>
